# Test execution and code quality checks
name: Code Quality

on:
  push:
    branches: [main, develop, copilot/**, fix/**, feature/**, release/**]
  pull_request:
    branches: [main, develop, copilot/**, fix/**, feature/**, release/**]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Python environment using uv
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff linter
        run: uv run ruff check src tests --no-cache

      - name: Run Ruff formatter check
        run: uv run ruff format --check src tests --no-cache

      - name: Run mypy type checking
        run: uv run mypy src

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Python environment using uv
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --only-group test

      - name: Run tests with coverage
        run: uv run pytest tests --cov=src/aelus --cov-report markdown-append:$GITHUB_STEP_SUMMARY
